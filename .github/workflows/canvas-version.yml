name: canvas-version
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  canvas-version:
    runs-on: ubuntu-latest
    steps:
      - name: PR description names the artifact version
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -Eq '^Canvas version: *[0-9]+ *$'; then
            echo "ok: $(printf '%s\n' "$BODY" | grep -E '^Canvas version:')"
          else
            echo "::error::The PR description must have a line 'Canvas version: N' (the Orbi Design System artifact version this was exported from). Change the artifact first, then export. See AGENTS.md."
            exit 1
          fi
